name: VIMO checks
on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**', 'release/**', 'hotfixes/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vimo
          POSTGRES_PASSWORD: vimo_test
          POSTGRES_DB: vimo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vimo -d vimo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: '1'
      VIMO_TEST_DATABASE_URL: postgresql://vimo:vimo_test@localhost:5432/vimo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm --prefix server test
