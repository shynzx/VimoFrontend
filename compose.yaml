services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vimo_local_only
      POSTGRES_DB: vimo_db
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - vimo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vimo_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vimo_postgres:
